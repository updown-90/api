plugins {
	id "java"
	id "org.springframework.boot" version "3.2.1"
	id "io.spring.dependency-management" version "1.1.4"
}

java {
	sourceCompatibility = '17'
}

compileJava {
	options.compilerArgs += ['-parameters']
}

// 멀티모듈 설정
allprojects {
	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	group = "com.updown"
	version = "0.0.1-SNAPSHOT"
	sourceCompatibility = "17"

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.1"
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.0"
		}
	}

	dependencies {
		// lombok
		compileOnly "org.projectlombok:lombok"
		annotationProcessor "org.projectlombok:lombok"

		// mapstruct
		implementation "org.mapstruct:mapstruct:1.5.3.Final"
		annotationProcessor "org.mapstruct:mapstruct-processor:1.5.3.Final"

		// querydsl
		implementation "com.querydsl:querydsl-core:5.0.0"
		implementation "com.querydsl:querydsl-jpa:5.0.0:jakarta"
		annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
		annotationProcessor "jakarta.persistence:jakarta.persistence-api"
		annotationProcessor "jakarta.annotation:jakarta.annotation-api"

		// test
		testImplementation "org.springframework.boot:spring-boot-starter-test"
	}

	test {
		useJUnitPlatform()
		testLogging {
			events "passed", "skipped", "failed"
		}
	}
}

// 루트 프로젝트 의존성 (Spring Boot 메인 애플리케이션)
dependencies {
	// 다른 모듈들을 JAR 파일로 의존성 추가
	implementation files('common/build/libs/common-0.0.1-SNAPSHOT.jar')
	implementation files('account/build/libs/account-0.0.1-SNAPSHOT.jar')
	implementation files('department/build/libs/department-0.0.1-SNAPSHOT.jar')

	// spring
	implementation "org.springframework.boot:spring-boot-starter-data-jpa"
	implementation "org.springframework.boot:spring-boot-starter-validation"
	implementation "org.springframework.boot:spring-boot-starter-security"
	implementation "org.springframework.boot:spring-boot-starter-web"
	implementation "org.springframework.boot:spring-boot-starter-aop"
	implementation "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j:3.0.0"
	developmentOnly "org.springframework.boot:spring-boot-devtools"

	// database
	implementation "com.h2database:h2"

	// jwt
	implementation "io.jsonwebtoken:jjwt-api:0.11.5"
	implementation "io.jsonwebtoken:jjwt-impl:0.11.5"
	implementation "io.jsonwebtoken:jjwt-jackson:0.11.5"

	// test
	testImplementation "org.springframework.boot:spring-boot-starter-test"
	testImplementation "org.springframework.security:spring-security-test"
}