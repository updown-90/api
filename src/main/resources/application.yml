spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cloud:
    compatibility-verifier:
      enabled: false

# JWT 설정
jwt:
  secret:
    key: mySecretKey123456789012345678901234567890
  access:
    token:
      validity: 3600000 # 1시간 (밀리초)
  refresh:
    token:
      validity: 86400000 # 24시간 (밀리초)

logging:
  level:
    com.updown.api: DEBUG
